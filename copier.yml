_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_envops:
  keep_trailing_newline: true

project_name:
  type: str
  help: Repository name (lowercase letters, numbers and hyphens)
  default: my-ml-project
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}Use a lowercase repository slug{% endif %}"
project_title:
  type: str
  help: Human-readable project title
  default: "{{ project_name | replace('-', ' ') | title }}"
package_name:
  type: str
  help: Python package identifier
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) or package_name in
    ['class', 'def', 'import', 'from', 'global', 'return', 'yield', 'raise', 'try',
    'except', 'finally', 'for', 'while', 'if', 'else', 'elif', 'pass', 'break',
    'continue', 'with', 'as', 'assert', 'del', 'lambda', 'nonlocal', 'and', 'or',
    'not', 'in', 'is', 'async', 'await', 'match', 'case'] %}Use a non-keyword lowercase Python identifier{% endif %}
problem_type:
  type: str
  help: Example and split strategy
  choices: [classification, regression, forecasting]
  default: classification
workspace_topology:
  type: str
  help: Deployment isolation
  choices:
    Separate DEV/QA/PROD workspaces and catalogs: separate_workspaces
    One workspace with DEV/QA/PROD catalogs: single_workspace
  default: separate_workspaces
# These are public connection settings, not credentials. DEV must be usable after generation.
dev_workspace_host:
  type: str
  help: HTTPS DEV workspace URL (also used by QA/PROD for a shared workspace)
  validator: >-
    {% if not (dev_workspace_host | regex_search('^https://[A-Za-z0-9][A-Za-z0-9.-]*(?::[0-9]+)?/?$')) %}
    Enter the HTTPS workspace origin, without a path, query or credentials
    {% endif %}
dev_catalog_action:
  type: str
  help: DEV catalog setup
  choices:
    Use an existing catalog: use_existing
    Create a new catalog on bundle deployment: create
  default: use_existing
dev_schemas_action:
  type: str
  help: DEV four schemas (lz, bronze, silver, gold)
  choices:
    Create and manage the four schemas with the bundle: create
    Use four existing schemas: use_existing
  when: "{{ dev_catalog_action == 'use_existing' }}"
  default: "{{ 'create' if dev_catalog_action == 'create' else 'use_existing' }}"
dev_catalog_storage_root:
  type: str
  help: Optional managed storage URL for a new DEV catalog (leave blank for metastore default)
  when: "{{ dev_catalog_action == 'create' }}"
  default: ""
dev_catalog:
  type: str
  help: DEV catalog name (lowercase letters, digits and underscores)
  validator: >-
    {% if not (dev_catalog | regex_search('^[a-z][a-z0-9_]*$')) %}
    Enter a lowercase catalog identifier supported by this reference
    {% endif %}
qa_workspace_host:
  type: str
  help: HTTPS QA workspace URL (optional; leave blank to configure later)
  when: "{{ workspace_topology == 'separate_workspaces' }}"
  default: "{{ dev_workspace_host if workspace_topology == 'single_workspace' else '' }}"
  validator: >-
    {% if qa_workspace_host and not (qa_workspace_host | regex_search('^https://[A-Za-z0-9][A-Za-z0-9.-]*(?::[0-9]+)?/?$')) %}
    Enter an HTTPS workspace origin or leave blank
    {% endif %}
qa_catalog_action:
  type: str
  help: QA catalog setup
  choices:
    Use an existing catalog: use_existing
    Create a new catalog on bundle deployment: create
  default: use_existing
qa_schemas_action:
  type: str
  help: QA four schemas (lz, bronze, silver, gold)
  choices:
    Create and manage the four schemas with the bundle: create
    Use four existing schemas: use_existing
  when: "{{ qa_catalog_action == 'use_existing' }}"
  default: "{{ 'create' if qa_catalog_action == 'create' else 'use_existing' }}"
qa_catalog_storage_root:
  type: str
  help: Optional managed storage URL for a new QA catalog (leave blank for metastore default)
  when: "{{ qa_catalog_action == 'create' }}"
  default: ""
qa_catalog:
  type: str
  help: QA catalog name (optional; leave blank to configure later)
  default: ""
  validator: >-
    {% if qa_catalog and (not (qa_catalog | regex_search('^[a-z][a-z0-9_]*$')) or qa_catalog == dev_catalog) %}
    Enter a lowercase QA catalog distinct from DEV, or leave blank
    {% endif %}
prod_workspace_host:
  type: str
  help: HTTPS PROD workspace URL (optional; leave blank to configure later)
  when: "{{ workspace_topology == 'separate_workspaces' }}"
  default: "{{ dev_workspace_host if workspace_topology == 'single_workspace' else '' }}"
  validator: >-
    {% if prod_workspace_host and not (prod_workspace_host | regex_search('^https://[A-Za-z0-9][A-Za-z0-9.-]*(?::[0-9]+)?/?$')) %}
    Enter an HTTPS workspace origin or leave blank
    {% endif %}
prod_catalog_action:
  type: str
  help: PROD catalog setup
  choices:
    Use an existing catalog: use_existing
    Create a new catalog on bundle deployment: create
  default: use_existing
prod_schemas_action:
  type: str
  help: PROD four schemas (lz, bronze, silver, gold)
  choices:
    Create and manage the four schemas with the bundle: create
    Use four existing schemas: use_existing
  when: "{{ prod_catalog_action == 'use_existing' }}"
  default: "{{ 'create' if prod_catalog_action == 'create' else 'use_existing' }}"
prod_catalog_storage_root:
  type: str
  help: Optional managed storage URL for a new PROD catalog (leave blank for metastore default)
  when: "{{ prod_catalog_action == 'create' }}"
  default: ""
prod_catalog:
  type: str
  help: PROD catalog name (optional; leave blank to configure later)
  default: ""
  validator: >-
    {% if prod_catalog and (not (prod_catalog | regex_search('^[a-z][a-z0-9_]*$')) or prod_catalog in [dev_catalog, qa_catalog]) %}
    Enter a lowercase PROD catalog distinct from DEV and QA, or leave blank
    {% endif %}
ingestion_mode:
  type: str
  help: Batch snapshots or incremental immutable JSON files
  choices: [batch, arriving_files]
  default: batch
