name: Template checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: databricks/setup-cli@v0.292.0
        with:
          version: "1.22.1"
      - run: uv sync --locked --group dev --group docs
      - run: make lint test docs-build
