[project]
name = "ml-databricks-template"
version = "0.1.0"
description = "Copier template for modular Databricks ML repositories"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["copier>=9.4,<10", "pytest>=8,<10", "jsonschema>=4.23,<5", "pyyaml>=6,<7", "ruff>=0.11,<1"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10", "pymdown-extensions>=10.14,<11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["template"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
